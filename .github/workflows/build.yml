name: Build Snap-to-Print installers

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android API 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test Android project
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Name APK for installation
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SnapToPrint-Android-debug.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SnapToPrint-Android-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows executable
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: windows/go.mod
      - name: Run receiver unit tests
        working-directory: windows
        run: go test ./...
      - name: Build standalone Windows x64 executable
        working-directory: windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: mkdir -p ../dist && go build -trimpath -ldflags="-s -w" -o ../dist/SnapToPrint-Windows-x64.exe .
      - name: Publish Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/SnapToPrint-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  package:
    name: Bundle installers
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: installers
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: installers
      - name: Create SHA-256 checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish combined installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: SnapToPrint-Installers
          path: installers/*
          if-no-files-found: error
          retention-days: 14
